name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 必须拿全历史：宪法门与原子图谱门都要 diff 基线 ref。浅克隆取不到 base 时，
      # 两个门都会明确打印"判不了"并 exit 0 —— 门就变成了摆设，比没有门更糟。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 pytest
        run: python -m pip install pytest
      - name: 运行全量单测(纯标准库零依赖)
        run: python -m pytest tests/ -v --tb=short
      - name: 下载即用自检（陌生人克隆后能不能跑起来）
        run: python scripts/verify_download_ready.py
      - name: 仓库自带验收（evals 题集 + 跑题器）
        run: |
          python scripts/verify_evals.py
          python scripts/run_evals.py
      - name: 代码宪法门（只判本次改动；存量走基线台账）
        env:
          CONSTITUTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/constitution_gate_changed.py
      - name: 原子图谱门（编排契约：能力/组合/依赖对得上才对）
        env:
          ATOMS_GRAPH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/verify_atoms_graph.py
      - name: 图谱生成物同步（禁止手改图与表）
        run: python scripts/verify_atoms_graph.py --check-drift
      # 下面三道此前只在本地跑，CI 不跑 —— 2026-10-23 的 4 处静默吞错就是这么漏的：
      # 拆函数时写进 `except OSError: continue`，pytest 全绿、宪法门全绿，CI 也会全绿，
      # 因为读不了的文件被当成「没这文件」，门根本没看见。绿要绿在真检查过的地方。
      - name: 静默吞错门（读不了就跳过 = 盲区少算，却照样报绿）
        run: python scripts/verify_silent_except_policy.py
      - name: 契约总账（manifest 声明的输入必须被实现接住）
        run: python scripts/export_contracts.py --check
      - name: 运行时依赖（没有未声明的第三方顶层 import）
        run: python scripts/verify_runtime_deps.py
      # 2026-10-23 新增。前 8 道门全在检查代码结构，没有一道检查工具自己的输出
      # 是不是空的：审一个 15 个 .js 的项目返回 `ok=true, count=0`，一个文件都没审
      # 却报「一切正常」，照样全绿。这条门钉住「空结果不许报成功」，
      # 同时钉住「对 JS 不判语法（没有解析器）」与「对 Python 必须判语法」这组对照，
      # 防止有人图省事把语法检查整体砍掉来让门变绿。
      - name: 空结果门（审计工具不许对空结果报成功）
        run: python scripts/verify_audit_nonempty.py

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 pytest
        run: python -m pip install pytest
      - name: 运行全量单测(纯标准库零依赖)
        run: python -m pytest tests/ -v --tb=short
      - name: 下载即用自检（陌生人克隆后能不能跑起来）
        run: python scripts/verify_download_ready.py
      - name: 仓库自带验收（evals 题集 + 跑题器）
        run: |
          python scripts/verify_evals.py
          python scripts/run_evals.py
      - name: 代码宪法门（只判本次改动；存量走基线台账）
        env:
          CONSTITUTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/constitution_gate_changed.py

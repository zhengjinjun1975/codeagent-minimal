<text x="120" y="798" fill="#0f172a" font-size="18">codeagent review bug_deep.py → score 0, 揪出: SQL注入(critical) · eval/exec · 不安全反序列化 · 圈复杂度超标</text>
<text x="120" y="818" fill="#64748b" font-size="15">干净文件 → score 100 · 零依赖纯标准库 · 云端 LLM / 远端 OSV 需显式开启（数据不出厂）</text>

